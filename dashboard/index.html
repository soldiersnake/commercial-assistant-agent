<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Gestión</title>
<style>
  :root{
    --azul:#1f4e78; --azul2:#2e6da4; --fondo:#f4f6f8; --borde:#d9dee3;
    --verde:#2e7d32; --naranja:#e65100; --amarillo:#f9a825; --rojo:#c62828;
    --morado:#6a4c93; --gris:#90a4ae;
  }
  *{box-sizing:border-box; margin:0}
  body{font-family:"Segoe UI",system-ui,sans-serif; background:var(--fondo); color:#22313f; font-size:14px}
  header{background:var(--azul); color:#fff; padding:14px 22px}
  header h1{font-size:19px; font-weight:600}
  header .sub{opacity:.85; font-size:12px}
  .metricas{display:flex; flex-wrap:wrap; gap:10px; padding:14px 22px}
  .chip{background:#fff; border:1px solid var(--borde); border-radius:8px;
        padding:8px 14px; min-width:120px}
  .chip .n{font-size:21px; font-weight:700}
  .chip .t{font-size:11px; color:#607080; text-transform:uppercase; letter-spacing:.4px}
  .chip.alerta .n{color:var(--rojo)}
  .chip.ok .n{color:var(--verde)}
  nav{display:flex; gap:4px; padding:0 22px; border-bottom:2px solid var(--azul); background:#fff}
  nav button{border:none; background:none; padding:10px 16px; font-size:14px; cursor:pointer;
             border-bottom:3px solid transparent; color:#45596b}
  nav button.activo{border-bottom-color:var(--azul); font-weight:600; color:var(--azul)}
  nav button .burbuja{background:var(--rojo); color:#fff; border-radius:9px; padding:1px 7px; font-size:11px}
  .contenedor{padding:16px 22px 60px}
  .barra{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center}
  .barra input[type=text], .barra select{padding:7px 10px; border:1px solid var(--borde); border-radius:6px; font-size:13px}
  .barra input[type=text]{min-width:230px}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden;
        box-shadow:0 1px 3px rgba(0,0,0,.08)}
  th{background:var(--azul); color:#fff; text-align:left; padding:8px 10px; font-size:12px;
     text-transform:uppercase; letter-spacing:.3px; white-space:nowrap}
  td{padding:7px 10px; border-top:1px solid var(--borde); vertical-align:top}
  tr:hover td{background:#eef4fa}
  .badge{display:inline-block; border-radius:10px; padding:2px 9px; font-size:11px; font-weight:600; white-space:nowrap}
  .b-pend{background:#fff3cd; color:#7a5c00}
  .b-borrador{background:#fff8e1; color:#8a6d00; border:1px dashed #d4b106}
  .b-respondido{background:#e3f2e1; color:#2e5b2e}
  .b-descartado{background:#eceff1; color:#455a64; border:1px dashed #90a4ae}
  .b-captacion{background:#fff3e0; color:#e65100; font-weight:600}
  .b-alta{background:#ffe0d1; color:#a03d00}
  .b-media{background:#e3f0fd; color:#1d5480}
  .b-baja{background:#eceff1; color:#546e7a}
  .b-empresa{background:#ede7f6; color:var(--morado)}
  .b-propio{background:#e8f5e9; color:var(--verde)}
  .b-ajeno{background:#efebe9; color:#6d4c41}
  .b-prospecto{background:#e1f5fe; color:#01579b}
  .b-rojo{background:#fdecea; color:var(--rojo)}
  .b-firmado{background:#e8f5e9; color:var(--verde)}
  .b-vencido{background:#fdecea; color:var(--rojo)}
  button.acc{border:1px solid var(--borde); background:#fff; border-radius:6px; padding:4px 10px;
             cursor:pointer; font-size:12px}
  button.acc:hover{background:var(--azul2); color:#fff; border-color:var(--azul2)}
  button.acc.primary{background:var(--azul); color:#fff; border-color:var(--azul); font-weight:600}
  td.c-acciones{white-space:normal; width:240px; min-width:210px; vertical-align:top}
  td.c-acciones button.acc{display:inline-block; margin:0 3px 5px 0; padding:4px 8px; white-space:nowrap}
  button.acc.danger{background:var(--rojo); color:#fff; border-color:var(--rojo)}
  button.acc.danger:hover{background:#b71c1c; border-color:#b71c1c; color:#fff}
  .oculto{display:none !important}
  /* modal */
  .fondo-modal{position:fixed; inset:0; background:rgba(20,40,60,.45); display:flex;
               align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50}
  .modal{background:#fff; border-radius:10px; max-width:640px; width:100%; padding:20px 24px;
         max-height:85vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modal .cabecera-fija{position:sticky; top:-20px; margin:-20px -24px 0; padding:6px 12px;
                        display:flex; justify-content:flex-end; background:#fff; z-index:5;
                        border-bottom:1px solid var(--borde)}
  .modal .cabecera-fija button{border:none; background:none; cursor:pointer; font-size:14px;
                               color:#607080; padding:4px 8px; border-radius:6px}
  .modal .cabecera-fija button:hover{background:var(--fondo); color:var(--rojo)}
  .modal h2{font-size:16px; margin-bottom:12px; color:var(--azul)}
  .modal label{display:block; font-size:12px; color:#607080; margin:10px 0 4px; font-weight:600}
  .modal input[type=text], .modal input[type=date], .modal input[type=time], .modal textarea,
  .modal select{width:100%; padding:8px 10px; border:1px solid var(--borde); border-radius:6px; font-size:13px; font-family:inherit}
  .modal textarea{min-height:110px; resize:vertical}
  .modal .pie{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
  .ficha-contacto{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--borde)}
  .ficha-contacto .tipo{font-size:11px; color:#607080; width:64px}
  .tarjeta{background:#fff; border:1px solid var(--borde); border-radius:8px; padding:14px 16px; margin-bottom:10px}
  .tarjeta h3{font-size:14px; color:var(--azul); margin-bottom:6px}
  .tarjeta .fila{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap}
  #toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#22313f;
         color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; z-index:99;
         box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .nota{font-size:12px; color:#607080}
  /* módulo económico */
  .tarjeta h3{display:flex; align-items:center; gap:8px}
  .progreso{background:#e3e8ee; border-radius:9px; height:22px; overflow:hidden; margin:8px 0}
  .progreso>div{height:100%; background:var(--verde); border-radius:9px}
  .progreso.sobre>div{background:var(--azul)}
  .progreso.atras>div{background:var(--rojo)}
  .embudo-chips{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
  .embudo-chip{border:1px solid var(--borde); border-radius:8px; padding:6px 12px; text-align:center}
  .embudo-chip .n{font-size:17px; font-weight:700}
  .embudo-chip .e{font-size:12px; color:#45596b}
  .embudo-chip .t{font-size:10px; color:#78909c; text-transform:uppercase}
  .flecha{align-self:center; color:#90a4ae; font-size:16px}
  .ranking tr.top td{background:#e8f5e9}
  .barras-mes{display:flex; gap:3px; align-items:flex-end; height:64px; margin:10px 0 2px}
  .barras-mes>div{flex:1; background:var(--azul2); border-radius:3px 3px 0 0; min-height:2px}
  .barras-mes>div.hoy{background:var(--verde)}
  .barras-mes>div.cero{background:#d6dde3}
  .ejes-mes{display:flex; gap:3px}
  .ejes-mes>span{flex:1; font-size:9px; color:#90a4ae; text-align:center}
  .venta-origen{font-size:10px; border-radius:8px; padding:1px 7px; margin-left:6px}
  .v-auto{background:#e3f0fd; color:#1d5480}
  .v-manual{background:#e8f5e9; color:var(--verde)}
  .vacío{text-align:center; padding:30px; color:#78909c}
  /* ── Asistente de primer uso (Fase 7) ── */
  .aviso-modo{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 22px;
              font-size:13px; border-bottom:1px solid var(--borde)}
  .aviso-modo.demo{background:#fff8e1; color:#6d5300}
  .aviso-modo.pendiente{background:#e3f0fd; color:#1d5480}
  .aviso-modo b{font-weight:600}
  .aviso-modo button{margin-left:auto}
  .asis-fondo{position:fixed; inset:0; background:var(--fondo); overflow:auto; z-index:40}
  .asis-cab{background:var(--azul); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:12px}
  .asis-cab h1{font-size:19px; font-weight:600}
  .asis-cab .cerrar{margin-left:auto; background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5);
                    border-radius:6px; padding:5px 12px; cursor:pointer; font-size:13px}
  .asis-cab .cerrar:hover{background:rgba(255,255,255,.12)}
  .asis-cuerpo{max-width:980px; margin:0 auto; padding:24px 22px 60px; display:grid;
               grid-template-columns:220px 1fr; gap:24px; align-items:start}
  .pasos{list-style:none; padding:0; position:sticky; top:16px}
  .pasos li{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:8px;
            cursor:pointer; color:#45596b; margin-bottom:4px}
  .pasos li:hover{background:#e8eef4}
  .pasos li.actual{background:#fff; color:var(--azul); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .pasos .num{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:none;
              font-size:12px; font-weight:700; border:2px solid var(--gris); color:var(--gris); background:#fff}
  .pasos li.actual .num{border-color:var(--azul); color:var(--azul)}
  .pasos li.hecho .num{background:var(--verde); border-color:var(--verde); color:#fff}
  .pasos .opc{display:block; font-size:10px; font-weight:400; color:#90a4ae; text-transform:uppercase; letter-spacing:.4px}
  .asis-panel{background:#fff; border:1px solid var(--borde); border-radius:10px; padding:24px 28px;
              box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .asis-panel h2{font-size:20px; color:var(--azul); margin-bottom:6px}
  .asis-panel .intro{color:#45596b; margin-bottom:18px; line-height:1.5}
  .asis-panel h3{font-size:15px; color:#22313f; margin:22px 0 10px}
  .asis-pie{display:flex; justify-content:space-between; gap:8px; margin-top:26px;
            padding-top:16px; border-top:1px solid var(--borde)}
  .btn{border:1px solid var(--borde); background:#fff; border-radius:8px; padding:9px 18px;
       cursor:pointer; font-size:14px; font-family:inherit; color:#22313f}
  .btn:hover{border-color:var(--azul2)}
  .btn.prim{background:var(--azul); border-color:var(--azul); color:#fff; font-weight:600}
  .btn.prim:hover{background:var(--azul2)}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn.google{display:inline-flex; align-items:center; gap:10px; font-weight:600; padding:11px 20px}
  .guia{counter-reset:guia; margin:0; padding:0; list-style:none}
  .guia>li{position:relative; border:1px solid var(--borde); border-radius:8px; padding:14px 16px 14px 56px;
           margin-bottom:10px; line-height:1.55}
  .guia>li::before{counter-increment:guia; content:counter(guia); position:absolute; left:14px; top:13px;
                   width:28px; height:28px; border-radius:50%; background:#e3f0fd; color:var(--azul);
                   display:grid; place-items:center; font-weight:700; font-size:13px}
  .guia>li.marcado{background:#f3faf3; border-color:#c8e6c9}
  .guia>li.marcado::before{content:"✓"; background:var(--verde); color:#fff}
  .guia b.t{display:block; font-size:14px; margin-bottom:2px}
  .guia .acciones{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:center}
  .guia a.ir{display:inline-block; background:var(--azul); color:#fff; text-decoration:none; border-radius:6px;
             padding:5px 12px; font-size:12px; font-weight:600}
  .guia a.ir:hover{background:var(--azul2)}
  .guia label.hecho{font-size:12px; color:#607080; display:flex; gap:5px; align-items:center; cursor:pointer; margin-left:auto}
  .clic{background:#eef2f6; border:1px solid #cfd8e1; border-radius:4px; padding:0 5px; font-size:12.5px;
        font-weight:600; white-space:nowrap}
  .copiar{border:1px dashed var(--azul2); background:#f5f9fd; color:var(--azul); border-radius:4px;
          padding:0 6px; font-family:Consolas,monospace; font-size:12.5px; cursor:pointer}
  .copiar:hover{background:#e3f0fd}
  .caja{border-radius:8px; padding:12px 14px; margin:12px 0; line-height:1.5; font-size:13px}
  .caja.info{background:#e3f0fd; color:#1d5480}
  .caja.aviso{background:#fff8e1; color:#6d5300; border:1px solid #f3e0a0}
  .caja.ok{background:#e8f5e9; color:#1b5e20; border:1px solid #c8e6c9}
  .caja.error{background:#fdecea; color:var(--rojo); border:1px solid #f5c6c2}
  .soltar{border:2px dashed #b0bec5; border-radius:10px; padding:26px; text-align:center; cursor:pointer;
          color:#607080; background:#fafbfc; transition:.15s}
  .soltar:hover, .soltar.encima{border-color:var(--azul2); background:#eef4fa; color:var(--azul)}
  .soltar .grande{font-size:26px; display:block; margin-bottom:4px}
  .form-rejilla{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px}
  .form-rejilla .ancho{grid-column:1 / -1}
  .asis-panel label.campo{display:block; font-size:12px; color:#607080; margin:10px 0 4px; font-weight:600}
  .asis-panel input[type=text], .asis-panel input[type=email]{width:100%; padding:9px 11px; border:1px solid var(--borde);
        border-radius:6px; font-size:14px; font-family:inherit}
  .asis-panel input:focus{outline:2px solid #bcd6ef; border-color:var(--azul2)}
  .contactos td{border:none; padding:3px 4px 3px 0}
  .contactos input{font-size:13px !important; padding:6px 8px !important}
  .lista-estado{list-style:none; padding:0}
  .lista-estado li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--borde)}
  .lista-estado .ic{width:22px; flex:none; text-align:center}
  pre.cmd{background:#22313f; color:#e8f1f8; padding:10px 12px; border-radius:6px; font-size:12.5px;
          margin:6px 0; white-space:pre-wrap; cursor:pointer; position:relative}
  pre.cmd::after{content:"copiar"; position:absolute; right:8px; top:8px; font-size:10px; color:#90a4ae;
                 font-family:"Segoe UI",sans-serif}
  .bienvenida{max-width:860px; margin:0 auto; padding:56px 22px}
  .bienvenida h2{font-size:28px; color:var(--azul); margin-bottom:8px}
  .bienvenida .intro{font-size:15px; color:#45596b; margin-bottom:28px; line-height:1.5}
  .caminos{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  .camino{background:#fff; border:2px solid var(--borde); border-radius:12px; padding:24px; cursor:pointer;
          text-align:left; font-family:inherit; color:inherit; transition:.15s; display:flex; flex-direction:column}
  .camino:hover{border-color:var(--azul2); box-shadow:0 6px 20px rgba(31,78,120,.12); transform:translateY(-1px)}
  .camino .ico{font-size:30px}
  .camino h3{font-size:17px; color:var(--azul); margin:10px 0 6px}
  .camino p{color:#45596b; line-height:1.5; font-size:13.5px; flex:1}
  .camino .cta{margin-top:16px; font-weight:600; color:var(--azul)}
  .camino.principal{border-color:var(--azul)}
  .resumen-num{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0}
  .resumen-num div{border:1px solid var(--borde); border-radius:8px; padding:8px 14px; text-align:center; min-width:100px}
  .resumen-num b{display:block; font-size:20px}
  .resumen-num span{font-size:11px; color:#607080; text-transform:uppercase}
  details.mas summary{cursor:pointer; color:var(--azul2); font-size:13px; margin:8px 0}
  @media (max-width:760px){
    .asis-cuerpo{grid-template-columns:1fr}
    .pasos{position:static; display:flex; overflow-x:auto; gap:4px}
    .pasos li{flex:none}
    .caminos, .form-rejilla{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header style="position:relative">
  <h1>Panel de Gestión</h1>
  <div class="sub" id="pie-cabecera"></div>
  <div style="position:absolute; top:12px; right:22px; display:flex; gap:8px">
    <button class="acc" id="btn-procesar" onclick="botonProcesar()" title="Lanza el proceso diario completo: mails, borradores, citas y datos">⚡ Procesar ahora</button>
    <button class="acc" id="btn-importar" onclick="botonImportar()" title="Importa el Excel de clientes depositado en la carpeta entrada/">📥 Importar clientes</button>
    <button class="acc" id="btn-config" onclick="abrirConfiguracion()" title="Conectar Google, tus datos, tus clientes y el asistente de IA">⚙️ Configuración</button>
  </div>
</header>
<div id="aviso-modo" class="oculto"></div>

<div class="metricas" id="metricas"></div>

<nav id="pestañas">
  <button data-tab="seguimientos" class="activo">Seguimientos <span id="burbuja-seg"></span></button>
  <button data-tab="clientes">Clientes</button>
  <button data-tab="presupuestos">Presupuestos</button>
  <button data-tab="programaciones">Programaciones <span id="burbuja-prog"></span></button>
  <button data-tab="citas">📅 Citas</button>
  <button data-tab="vinculaciones">Vinculaciones <span id="burbuja-vin"></span></button>
</nav>

<div class="contenedor" id="contenido"></div>
<div id="modal-raiz"></div>
<div id="asistente" class="oculto"></div>
<div id="toast" class="oculto"></div>

<script>
"use strict";
/* ── Estado global ── */
let EST = null;          // instantánea del servidor
let TAB = "seguimientos";
let huellaEst = null;    // huella de los datos para detectar cambios
let pendienteRefresco = false;

const CATEGORIA_TXT = {
  tecnico: "🔧 Técnico", facturacion: "💳 Facturación",
  trabajos_pendientes: "📋 Trabajos pend.", comercial: "💼 Comercial",
  empresa: "🏢 Empresa",
};
const ESTADO_PRES = {
  enviado: "📤 Enviado", pendiente_firma: "⏳ Pendiente firma",
  firmado: "✅ Firmado", rechazado: "❌ Rechazado", anulado: "🚫 Anulado",
};

function esc(t){
  return String(t ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fFecha(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("es-ES", {day:"2-digit", month:"2-digit", year:"numeric"});
}
function fEuro(n){ return n ? n.toLocaleString("es-ES", {maximumFractionDigits:0}) + " €" : ""; }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.remove("oculto");
  clearTimeout(t._id); t._id = setTimeout(() => t.classList.add("oculto"), 4000);
}

async function cargar(){
  const r = await fetch("/api/estado");
  EST = await r.json();
  huellaEst = huellaDe(EST);
  render();
}

/* ── Auto-refresco cada 30 s sin recargar la página ── */
function huellaDe(est){
  return JSON.stringify([
    est.metricas,
    est.seguimientos.map(s => [s.id, s.estado, s.descripcion,
                               s.captacion, s.paso_pendiente?.n, s.paso_pendiente?.estado,
                               s.paso_pendiente?.fecha_programada,
                               s.fecha_ultima_interaccion || s.fecha_ultimo_movimiento]),
    est.presupuestos.map(p => [p.id, p.estado, p.proxima_reclamacion]),
    est.programaciones.map(p => [p.id, p.estado, p.fecha_programada]),
    est.clientes.length, est.sin_vincular.length, est.duplicados.length,
    est.ventas.map(v => [v.id, v.importe, v.fecha, v.descripcion, v.cliente_id]),
    est.citas.map(c => [c.id, c.estado, c.fecha, c.hora,
                        c.modificaciones.length,
                        c.resultado ? c.resultado.dio_resultado : null]),
    est.seguimientos.map(s => [s.id, s.fecha_ultimo_envio]),
  ]);
}
function hayModal(){ return !!document.querySelector(".fondo-modal"); }
function escribiendo(){
  const a = document.activeElement;
  return !!a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName);
}
setInterval(async () => {
  try {
    const r = await fetch("/api/estado");
    if (!r.ok) return;
    const nuevo = await r.json();
    const h = huellaDe(nuevo);
    const seguro = !hayModal() && !escribiendo();
    if (h !== huellaEst) {
      if (seguro) {
        EST = nuevo; huellaEst = h; render();
        toast("🔄 Datos actualizados");
      } else {
        pendienteRefresco = true;   // espera a que termines de escribir / cerrar el modal
      }
    } else if (pendienteRefresco && seguro) {
      EST = nuevo; huellaEst = h; render(); pendienteRefresco = false;
      toast("🔄 Datos actualizados");
    }
  } catch (e) { /* servidor no disponible: siguiente intento */ }
}, 30000);

async function accion(tipo, payload){
  const r = await fetch("/api/accion", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({tipo, ...payload}),
  });
  const resp = await r.json();
  toast(resp.mensaje ?? "");
  if(resp.estado) { EST = resp.estado; render(); }
}

/* ── Render principal ── */
function render(){
  document.getElementById("pie-cabecera").textContent =
    `Datos al ${new Date(EST.generado).toLocaleString("es-ES")} · usuario: ${EST.config.asesor?.nombre ?? ""}`;
  renderMetricas();
  renderBurbujas();
  const c = document.getElementById("contenido");
  c.innerHTML = ({seguimientos: vistaSeguimientos, clientes: vistaClientes,
                  presupuestos: vistaPresupuestos, programaciones: vistaProgramaciones,
                  citas: vistaCitas, vinculaciones: vistaVinculaciones})[TAB]();
}

function renderMetricas(){
  const m = EST.metricas;
  const chips = [
    ["Pendientes respuesta", m.pendientes_respuesta, m.pendientes_respuesta ? "alerta" : "ok"],
    ["En borrador", m.en_borrador, m.en_borrador ? "alerta" : ""],
    ["Urgentes", m.urgentes, m.urgentes ? "alerta" : ""],
    ["> 7 días sin resp.", m.sin_responder_7, m.sin_responder_7 ? "alerta" : ""],
    ["Pend. de firma", m.presup_pendiente_firma, ""],
    ["€ pendiente firma", fEuro(m.presup_importe_pendiente), ""],
    ["€ firmado en el año", fEuro(m.presup_importe_firmado_anno), "ok"],
    ["Programaciones", m.programaciones_pend, ""],
    ["Vencidas sin enviar", m.programaciones_vencidas, m.programaciones_vencidas ? "alerta" : ""],
    ["Citas programadas", m.citas_programadas, ""],
    ["Citas efectuadas", m.citas_efectuadas, "ok"],
    ["Sin vincular", m.sin_vincular, m.sin_vincular ? "alerta" : ""],
    ["🎯 Captaciones", m.captaciones_activas, m.captacion_pasos_vencidos ? "alerta" : ""],
    ["Pasos captación vencidos", m.captacion_pasos_vencidos, m.captacion_pasos_vencidos ? "alerta" : ""],
    ["Clientes propios", m.propios, ""],

  ];
  document.getElementById("metricas").innerHTML =
    chips.map(([t, n, cls]) => `<div class="chip ${cls}"><div class="n">${esc(n)}</div><div class="t">${esc(t)}</div></div>`).join("");
}

function renderBurbujas(){
  const m = EST.metricas;
  document.getElementById("burbuja-seg").innerHTML =
    m.pendientes_respuesta ? `<span class="burbuja">${m.pendientes_respuesta}</span>` : "";
  document.getElementById("burbuja-prog").innerHTML =
    m.programaciones_vencidas ? `<span class="burbuja">${m.programaciones_vencidas}</span>` : "";
  document.getElementById("burbuja-vin").innerHTML =
    (m.sin_vincular || EST.duplicados.length)
      ? `<span class="burbuja">${m.sin_vincular + EST.duplicados.length}</span>` : "";
}

document.getElementById("pestañas").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tab]");

  TAB = btn.dataset.tab;
  document.querySelectorAll("#pestañas button").forEach(b =>

});

      <option value="alta" ${filtroSeg.prioridad==="alta"?"selected":""}>🔴 Alta</option>
      <option value="media" ${filtroSeg.prioridad==="media"?"selected":""}>🟠 Media</option>
      <option value="baja" ${filtroSeg.prioridad==="baja"?"selected":""}>⚪ Baja</option></select>

  return `<tr ${empresa ? 'style="background:#faf7fc"' : ""}>
    <td>${badgeCli}<b>${esc(s.cliente_nombre || "")}</b><br><span class="nota">${esc(s.cliente_id || "")}</span>${s.correo_origen ? `<br><span class="nota" style="color:var(--azul)">✉️ ${esc(s.correo_origen)}</span>` : ""}</td>
    <td>${s.nuevo ? '<span class="badge b-media">🆕 Nuevo</span> ' : (s.continua_de ? `<span class="nota">continúa ${esc(s.continua_de)}</span> ` : "")}
        <b>${esc(s.descripcion || s.asunto || "(sin descripción)")}</b>${s.captacion ? ' <span class="badge b-captacion">🎯 Captación</span>' : ""}${s.proximo_paso ? `<br><span class="nota">➜ ${esc(s.proximo_paso)}</span>` : ""}${s.paso_pendiente ? `<br><span class="nota" style="color:${s.paso_pendiente.vencido ? "var(--rojo)" : "inherit"}; font-weight:${s.paso_pendiente.vencido ? "600" : "normal"}">🎯 Paso ${s.paso_pendiente.n}/3 — ${esc(s.paso_pendiente.concepto)} (${fFecha(s.paso_pendiente.fecha_programada)})${s.paso_pendiente.vencido ? " ⚠️ vencido" : ""}</span>` : ""}${s.motivo_descarte ? `<br><span class="nota" style="color:#455a64">🚫 Motivo del descarte: ${esc(s.motivo_descarte)}</span>` : ""}${s.edificio ? `<br><span class="nota">Edificio: ${esc(s.edificio)}</span>` : ""}
        <div style="display:flex; align-items:center; gap:70px; margin-top:8px">${s.thread_id ? `<button class="acc" onclick="modalHilo('${esc(s.thread_id)}','${esc(s.cliente_nombre || s.id)}')" title="Ver la conversación completa">👁️ Hilo</button>` : ""}<button class="acc primary" onclick="modalResponder('${esc(s.id)}')" title="Redacta la respuesta; el agente la pulirá y dejará el borrador en Gmail">✍️ Responder</button></div></td>
    <td>${CATEGORIA_TXT[s.categoria] || esc(s.categoria)}</td>
    <td><span class="badge b-${esc(s.prioridad || "baja")}">${(s.prioridad || "baja").toUpperCase()}</span></td>
    <td>${s.estado === "descartado" ? '<span class="badge b-descartado">🚫 Descartado</span>' : `<span class="badge ${pend ? (s.estado === "borrador_creado" ? "b-borrador" : "b-pend") : "b-respondido"}">${s.estado === "borrador_creado" ? "🟡 En borrador" : pend ? "⏳ Pendiente" : "✅ Respondido"}</span>`}</td>
    <td>${fFecha(s.fecha_ultima_interaccion || s.fecha_ultimo_movimiento)}</td>
    <td>${s.fecha_ultimo_envio ? `<b>${fFecha(s.fecha_ultimo_envio)}</b>` : '<span class="nota">—</span>'}</td>
    <td>${dias != null ? `<b style="color:${dias >= 7 ? "var(--rojo)" : dias >= 4 ? "var(--amarillo)" : "inherit"}">${dias}</b>` : ""}</td>
    <td class="c-acciones">${s.estado === "borrador_creado" ? `<button class="acc" onclick="accion('estado_seguimiento',{id:'${esc(s.id)}',estado:'respondido'})" title="Marca el caso como respondido cuando hayas enviado el borrador a mano">✅ Envié</button>` : ""}${s.paso_pendiente && s.paso_pendiente.estado === "borrador_creado" ? `<button class="acc" onclick="accion('captacion_paso',{id:'${esc(s.id)}',n:${s.paso_pendiente.n},estado:'enviado'})" title="Marca este paso del plan de captación como enviado a mano">✅ Paso ${s.paso_pendiente.n}</button>` : ""}${s.paso_pendiente ? `<button class="acc" onclick="modalReprogramarPaso('${esc(s.id)}',${s.paso_pendiente.n},'${esc(s.paso_pendiente.fecha_programada || "")}')" title="Adelanta o atrasa la fecha de este paso">📅 Paso</button>` : ""}<button class="acc" onclick="modalAgendarCita('${esc(s.id)}')" title="Crea la cita en su Calendar y deja el borrador de aviso al cliente">📅 Cita</button>${s.estado !== "cerrado" && s.estado !== "descartado" ? `<button class="acc danger" onclick="modalDescartar('${esc(s.id)}')" title="Cierra el caso sin responder (hilo ya resuelto, informativo…). Se archiva con una nota, no se borra">🚫 Descartar</button>` : ""}${s.estado !== "cerrado" && s.estado !== "descartado" && s.categoria === "comercial" ? `<button class="acc" onclick="accion('captacion_toggle',{id:'${esc(s.id)}',captacion:${s.captacion ? "false" : "true"}})" title="${s.captacion ? "No es captación: es gestión de un cliente ya existente" : "Es una primera contactación comercial (prospecto nuevo o edificio ajeno): activa el plan de 3 propuestas"}">${s.captacion ? "👤 Cliente" : "🎯 Captación"}</button>` : ""}${s.estado !== "cerrado" && s.estado !== "descartado" && s.categoria !== "empresa" ? `<button class="acc" onclick="modalRecategorizar('${esc(s.id)}','${esc(s.categoria || "")}')" title="Corrige la categoría si la clasificación automática falló. Para marcarla CAPTACIÓN primero pásala a 💼 Comercial">⇄ Categoría</button>` : ""}</td>
  </tr>`;
}

/* ── Modal responder ── */
function modalResponder(idSeg){
  const s = EST.seguimientos.find(x => x.id === idSeg);
  const cli = EST.clientes.find(c => c.id === s.cliente_id);
  const correos = (cli?.fichas_contacto || []).filter(f => f.tipo === "email");
  const origen = s.correo_origen && correos.some(f => f.valor === s.correo_origen)
    ? s.correo_origen : (correos[0]?.valor || "");
  abrirModal(`
    <h2>✍️ Responder — ${esc(cli?.nombre ?? s.cliente_id ?? "interno")}</h2>
    ${s ? `<div class="nota">Caso: ${esc(s.descripcion || "")} (${esc(s.id)})</div>` : ""}
    <label>Responder a (hilo de origen)</label>
    <select id="m-correo">${correos.map(f => `<option value="${esc(f.valor)}" ${f.valor===origen?"selected":""}>${esc(f.valor)}</option>`).join("") || `<option value="">(sin email en ficha)</option>`}</select>
    <label>Su respuesta (tal como quiera escribirla; el agente la pulirá)</label>
    <textarea id="m-texto" placeholder="Ej: rivera, le digo q el martes pasamos a ver el motor del 2ºB"></textarea>
    <label><input type="checkbox" id="m-prog-check" style="width:auto"> Programar el envío para otra fecha</label>
    <div id="m-prog-campos" class="oculto" style="display:flex; gap:10px">
      <div style="flex:1"><label>Fecha</label><input type="date" id="m-prog-fecha" value="${EST.hoy}"></div>
      <div><label>Hora</label><input type="time" id="m-prog-hora" value="09:00"></div>
    </div>
    <div class="pie">
      <button class="acc" onclick="cerrarModal()">Cancelar</button>
      <button class="acc primary" onclick="enviarResponder('${esc(idSeg)}')">Generar borrador</button>
    </div>
    <p class="nota" style="margin-top:10px">El agente creará un <b>borrador en Gmail</b> con su texto corregido y con contexto del caso. Usted lo revisa y lo envía. El sistema nunca envía por su cuenta.</p>`);
  document.getElementById("m-prog-check").addEventListener("change", e =>
    document.getElementById("m-prog-campos").classList.toggle("oculto", !e.target.checked));
  document.getElementById("m-texto").focus();
}

function enviarResponder(idSeg){
  const texto = document.getElementById("m-texto").value.trim();
  if(!texto){ toast("Escriba la respuesta primero"); return; }
  const s = EST.seguimientos.find(x => x.id === idSeg);
  const progCheck = document.getElementById("m-prog-check").checked;
  const payload = {
    seguimiento_id: idSeg,
    cliente_id: s?.cliente_id ?? null,
    correo_origen: document.getElementById("m-correo").value,
    texto,
    programar: progCheck ? {fecha: document.getElementById("m-prog-fecha").value,
                            hora: document.getElementById("m-prog-hora").value || "09:00"} : null,
  };
  cerrarModal(); accion("responder", payload);
}

function tarjetaObjetivo(eco){
  const obj = eco.objetivo_monto;
  if (!obj){
    return `<div class="tarjeta"><h3>🎯 Objetivo anual ${eco.anno}</h3>
      <p class="nota">Aún sin fijar. Con el objetivo, aquí verás el progreso, el gráfico mensual de lo facturado, la proyección a fin de año y el potencial de lo pendiente.</p>
      <button class="acc primary" onclick="modalObjetivo()">🎯 Fijar objetivo</button></div>`;
  }
  const pct = eco.progreso ?? 0;
  const clase = pct >= 100 ? "sobre" : (eco.mes_pct != null && eco.mes_pct < 80 ? "atras" : "");
  const proy = eco.proyeccion != null
    ? `<b>${fEuro(eco.proyeccion)}</b> proyectados a fin de año ` +
      (eco.proyeccion < obj ? `<span style="color:var(--rojo)">(${fEuro(obj - eco.proyeccion)} por debajo del objetivo)</span>` : `<span style="color:var(--verde)">(objetivo superado)</span>`)
    : "";
  const maxMes = Math.max(...eco.por_mes, obj / 12, 1);
  const barras = eco.por_mes.map((v, i) => {
    const alto = Math.max(2, Math.round(64 * v / maxMes));
    const clase = v === 0 ? "cero" : (i === new Date().getMonth() ? "hoy" : "");
    const tip = `${["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][i]}: ${fEuro(v)}` +
      `\nAutomáticas: ${fEuro(eco.por_mes_auto[i])} · Manuales: ${fEuro(eco.por_mes_manual[i])}`;
    return `<div class="${clase}" style="height:${alto}px" title="${esc(tip)}"></div>`;
  }).join("");
  return `<div class="tarjeta"><h3>🎯 Objetivo anual ${eco.anno}: ${fEuro(obj)}</h3>
    <div class="progreso ${clase}"><div style="width:${Math.min(pct, 100)}%"></div></div>
    <div>Facturado en el año: <b>${fEuro(eco.total_anno)}</b> (${pct}%) ` +
      `· Automáticas: ${fEuro(eco.firmado_anno)} · Manuales: ${fEuro(eco.manual_anno)}<br>` +
      `Este mes: <b>${fEuro(eco.firmado_mes)}</b> ${eco.mes_pct != null ? `(${eco.mes_pct}% del objetivo mensual)` : ""}</div>
    <div class="barras-mes">${barras}</div>
    <div class="ejes-mes">${["E","F","M","A","M","J","J","A","S","O","N","D"].map(m => `<span>${m}</span>`).join("")}</div>
    ${proy ? `<div style="margin-top:6px">📈 ${proy}</div>` : ""}
    <div style="margin-top:6px">💡 Potencial pendiente de firmar: <b>${fEuro(eco.potencial)}</b>
        <span class="nota">(de los cuales ${fEuro(eco.captacion.reduce((s, c) => s + (c.importe || 0), 0))} son de captación)</span></div>
    <div style="margin-top:8px"><button class="acc" onclick="modalObjetivo()">Cambiar objetivo</button></div></div>`;
}

/* agenda real de Google (caché de 5 min) */
let agendaGoogle = {cargada: null, momento: 0};

function cargarAgendaGoogle(forzar){
  const cont = document.getElementById("agenda-google");
  if (!cont) return;
  const fresco = (Date.now() - agendaGoogle.momento) < 5 * 60 * 1000;
  if (agendaGoogle.cargada && fresco && !forzar){
    pintarAgendaGoogle(cont); return;
  }
  cont.innerHTML = '<p class="nota">Cargando su calendario real…</p>';
  fetch("/api/agenda").then(r => r.json()).then(resp => {
    if (!resp.ok){ cont.innerHTML = '<p class="nota">No se pudo leer el calendario ahora mismo.</p>'; return; }
    agendaGoogle = {cargada: resp.eventos, momento: Date.now()};
    pintarAgendaGoogle(cont);
  }).catch(() => { cont.innerHTML = '<p class="nota">No se pudo leer el calendario ahora mismo.</p>'; });
}

function pintarAgendaGoogle(cont){
  const eventos = agendaGoogle.cargada || [];
  if (!eventos.length){
    cont.innerHTML = '<p class="nota" style="margin-top:8px">Nada agendado en los próximos 14 días en Google Calendar.</p>';
    return;
  }
  cont.innerHTML = eventos.map(ev => `
    <div style="display:flex; gap:10px; align-items:baseline; padding:5px 8px; margin-top:4px;
        border-radius:6px; background:var(--fondo)">
      <span style="font-size:12px; white-space:nowrap"><b>${fFecha(ev.fecha)}</b>
        ${ev.hora !== "todo el día" ? `<b>${esc(ev.hora)}</b>${ev.hora_fin ? "–" + esc(ev.hora_fin) : ""}` : "🔒"}</span>
      <span style="font-size:12px"><b>${esc(ev.titulo)}</b>${ev.ubicacion ? ` <span class="nota">· ${esc(ev.ubicacion)}</span>` : ""}</span>
      <span style="margin-left:auto; white-space:nowrap">
        <span class="venta-origen ${ev.del_sistema ? "v-auto" : "v-manual"}">${ev.del_sistema ? "🤖 del sistema" : "✍️ a mano"}</span></span>
    </div>`).join("");
}

const MES_CORTO = ["E","F","M","A","M","J","J","A","S","O","N","D"];

function vistaCitas(){
  const citas = EST.citas;
  const m = EST.metricas;
  const resueltas = citas.filter(c => c.estado === "efectuada");
  const conResultado = resueltas.filter(c => c.resultado && c.resultado.dio_resultado);
  const maxBarra = Math.max(m.citas_programadas, m.citas_efectuadas,
                            m.citas_canceladas, conResultado.length, 1);
  const barra = (t, n, color) => n || t ? `
    <div style="margin:6px 0"><div style="display:flex; justify-content:space-between; font-size:12px">
      <span>${t}</span><b>${n}</b></div>
      <div class="progreso" style="height:14px"><div style="width:${Math.round(100 * n / maxBarra)}%; background:${color}"></div></div></div>` : "";
  const hoyISO = EST.hoy;
  const futuras = citas.filter(c => c.estado === "programada")
    .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const pasadas = citas.filter(c => c.estado !== "programada")
    .sort((a, b) => (b.fecha + (b.hora || "")).localeCompare(a.fecha + (a.hora || "")));
  setTimeout(() => cargarAgendaGoogle(), 50);
  return `
  <div class="tarjeta"><h3>📊 Citas</h3>
    ${barra("📅 Programadas", m.citas_programadas, "var(--azul2)")}
    ${barra("✅ Efectuadas", m.citas_efectuadas, "var(--verde)")}
    ${barra("❌ Canceladas", m.citas_canceladas, "var(--rojo)")}
    ${barra("💼 Efectuadas con resultado (contrato/venta)", conResultado.length, "var(--amarillo)")}
    <div style="margin-top:4px">🔁 Modificaciones: <b>${m.citas_modificaciones}</b>
      · Tasa de resultado: <b>${resueltas.length ? Math.round(100 * conResultado.length / resueltas.length) + "%" : "—"}</b></div>
    <div style="margin-top:8px"><button class="acc primary" onclick="modalAgendarCita()">➕ Añadir cita (sin cliente: solo Calendar)</button></div>
  </div>
  <div class="tarjeta"><h3>📆 Agenda de Google (próximos 14 días)
      <button class="acc" style="margin-left:auto" onclick="cargarAgendaGoogle(true)">🔄 Actualizar</button></h3>
    <div id="agenda-google"><p class="nota">Cargando su calendario real…</p></div>
  </div>
  <div class="tarjeta"><h3>📅 Próximas citas del sistema (${futuras.length})</h3>
    ${futuras.length ? futuras.map(cFila).join("") : `<p class="nota">Ninguna. Desde un seguimiento con «📅 Agendar» o con el botón de arriba.</p>`}
  </div>
  <div class="tarjeta"><h3>🗂️ Historial de citas (${pasadas.length})</h3>
    ${pasadas.length ? pasadas.map(cFila).join("") : `<p class="nota">Aún no hay citas efectuadas ni canceladas.</p>`}
  </div>`;
}

function cFila(c){
  const cli = EST.clientes.find(x => x.id === c.cliente_id);
  const estadoBadge = {
    programada: `<span class="badge b-media">📅 Programada</span>`,
    efectuada: `<span class="badge b-firmado">✅ Efectuada</span>`,
    cancelada: `<span class="badge b-rojo">❌ Cancelada</span>`,

/* ocupación del día + aviso de solapamiento (crear y reprogramar) */
const H_INI = 8, H_FIN = 20;
function aMin(hhmm){ const [h, m] = hhmm.split(":").map(Number); return h * 60 + (m || 0); }

function pintarOcupacion(cont, fecha, bloques, propuesta){
  // propuesta = {ini, fin} en minutos, para marcar conflicto
  let aviso = "";
  const choques = propuesta ? bloques.filter(b =>
    b.todo_el_dia || (propuesta.ini < aMin(b.fin) && propuesta.fin > aMin(b.ini))) : [];
  if (propuesta){
    aviso = choques.length
      ? `<div class="b-rojo" style="padding:8px 10px; border-radius:6px; margin:8px 0 0">⚠️ <b>Ojo: se pisa con</b> ` +
        choques.map(c => `"${esc(c.titulo)}" (${c.inicio}–${c.fin})`).join(", ") +
        `. Puedes crearla igual si te conviene.</div>`
      : `<div class="b-firmado" style="padding:8px 10px; border-radius:6px; margin:8px 0 0">✅ Franja libre en su agenda</div>`;
  }
  const filas = bloques.map(b => {
    const choca = propuesta && (propuesta.ini < aMin(b.fin) && propuesta.fin > aMin(b.ini));
    return `<div style="display:flex; gap:10px; align-items:baseline; padding:5px 8px; margin-top:4px;
        border-radius:6px; ${choca ? "background:#fdecea; border:1px solid #f5c6cb" : "background:var(--fondo)"}">
        <span style="font-size:12px; white-space:nowrap"><b>${b.todo_el_dia ? "🔒 todo el día" : esc(b.inicio) + " – " + esc(b.fin)}</b></span>
        <span style="font-size:12px">${choca ? "🔴 " : "🔒 "}${esc(b.titulo)}</span></div>`;
  }).join("");
  cont.innerHTML = `
    <div style="margin:10px 0 2px"><b style="font-size:12px">🗓️ Su agenda del ${esc(fecha)}:</b>
      ${bloques.length ? "" : ' <span class="nota">libre todo el día</span>'}</div>
    ${filas}
    ${!bloques.length ? "" : aviso}`;
}

async function verOcupacionCita(){
  const cont = document.getElementById("m-c-ocup");
  if (!cont) return;
  const fecha = document.getElementById("m-c-fecha").value;
  const hora = document.getElementById("m-c-hora").value || "10:00";
  const dur = parseInt(document.getElementById("m-c-dur").value) || 60;
  cont.innerHTML = '<p class="nota">Consultando su agenda…</p>';
  try {
    const r = await fetch("/api/ocupacion?fecha=" + encodeURIComponent(fecha));
    const resp = await r.json();
    if (!resp.ok){ cont.innerHTML = ""; return; }
    pintarOcupacion(cont, fecha, resp.bloques, {ini: aMin(hora), fin: aMin(hora) + dur});
  } catch (e) { cont.innerHTML = ""; }
}

function guardarCita(idSeg){
  const s = idSeg ? EST.seguimientos.find(x => x.id === idSeg) : null;
  const payload = {

    titulo: document.getElementById("m-c-titulo").value.trim(),

    hora: document.getElementById("m-c-hora").value,

  };

function fusionarDesdeSelect(idSelect){
  const select = document.getElementById("dup-" + idSelect);
  if(!select){ toast("No se encontró la pareja"); return; }

  const absorbido = todos.find(v => v !== destino);
  if(!absorbido){ toast("No hay pareja que fusionar"); return; }
  if(confirm(`¿Fusionar «${absorbido}» dentro de «${destino}»? La ficha absorbida se archiva y no se pierde.`)){
    accion("fusionar", {id_destino: destino.split(" ")[0], id_absorbido: absorbido.split(" ")[0]});
  }
}

let hiloOrdenNuevoPrimero = true;   // por defecto: la más nueva arriba

function hiloMensaje(m){
  return `
    <div style="border-top:1px solid var(--borde); padding:8px 0">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">

                  background:var(--fondo); border-radius:6px; padding:8px; margin-top:4px">${esc(m.cuerpo || "")}</div>

}

function hiloPintar(titulo){
  const msgs = [...hiloActual].sort((a, b) => {
    const fa = new Date(a.fecha), fb = new Date(b.fecha);
    return hiloOrdenNuevoPrimero ? fb - fa : fa - fb;
  });
  abrirModal(`<h2>👁️ Conversación — ${esc(titulo || "")}
      <button class="acc" style="font-size:11px; margin-left:8px" onclick="hiloInvertir('${esc(titulo || "")}')" title="Cambiar entre más nueva primero / más antigua primero">${hiloOrdenNuevoPrimero ? "⇅ Más antigua primero" : "⇅ Más nueva primero"}</button></h2>
    ${msgs.map(hiloMensaje).join("")}
    <div class="pie"><button class="acc" onclick="cerrarModal()">Cerrar</button></div>`);
}

function hiloInvertir(titulo){
  hiloOrdenNuevoPrimero = !hiloOrdenNuevoPrimero;
  hiloPintar(titulo);
}

async function modalHilo(threadId, titulo){
  abrirModal(`<h2>👁️ Conversación — ${esc(titulo || "")}</h2>

    if (!resp.ok){ toast(resp.error || "No se pudo leer el hilo"); cerrarModal(); return; }

function lsLeer(k){ try { return localStorage.getItem("asis-" + k); } catch(e){ return null; } }
function lsGuardar(k, v){ try { localStorage.setItem("asis-" + k, v); } catch(e){} }

async function cargarSetup(){
  const r = await fetch("/api/setup/estado");
  SETUP = await r.json();
  return SETUP;
}
async function setupPost(ruta, payload){
  const r = await fetch("/api/setup/" + ruta, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload || {}),
  });
  const resp = await r.json();
  if (resp.setup) SETUP = resp.setup;
  return resp;
}
function pasoHecho(id){
  if (!SETUP) return false;
  return {google: SETUP.google.conectado, datos: SETUP.datos.hecho,
          clientes: SETUP.clientes.hecho, ia: SETUP.ia.listo}[id];
}

async function conectarGoogle(boton){
  boton.disabled = true;
  try {
    const r = await fetch("/api/setup/google/conectar");
    const resp = await r.json();
    if (!resp.ok){ toast(resp.mensaje); boton.disabled = false; return; }
    window.location.href = resp.url;     // Google vuelve a http://127.0.0.1:8765/
  } catch(e){ toast("No se pudo iniciar la conexión"); boton.disabled = false; }
}
async function probarGoogle(boton){
  boton.disabled = true; boton.textContent = "⏳ Probando…";
  const resp = await (await fetch("/api/setup/google/probar")).json();
  await cargarSetup();
  renderAsistente();
  toast((resp.ok ? "✅ " : "⚠️ ") + resp.mensaje);
}

/* ── Subida de ficheros (arrastrar o elegir) ── */
function activarZonasSoltar(){
  document.querySelectorAll(".soltar[data-subir]").forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add("encima"); };
    z.ondragleave = () => z.classList.remove("encima");
    z.ondrop = e => { e.preventDefault(); z.classList.remove("encima");
                      if (e.dataTransfer.files[0]) subirFichero(e.dataTransfer.files[0], z.dataset.subir); };
  });
}
function leerBase64(fichero){
  return new Promise((ok, mal) => {
    const lector = new FileReader();
    lector.onload = () => ok(String(lector.result).split(",")[1] || "");
    lector.onerror = mal;
    lector.readAsDataURL(fichero);
  });
}
let RESULTADO_CLIENTES = null;
async function subirFichero(fichero, tipo){
  if (!fichero) return;
  const zona = document.querySelector(`.soltar[data-subir="${tipo}"]`);
  if (zona) zona.innerHTML = `<span class="grande">⏳</span>${tipo === "clientes"
    ? "Importando tus clientes… (puede tardar un minuto)" : "Comprobando la llave…"}`;
  try {
    const contenido_b64 = await leerBase64(fichero);
    const resp = await setupPost(tipo, {nombre: fichero.name, contenido_b64});
    if (tipo === "clientes") RESULTADO_CLIENTES = resp;
    toast((resp.ok ? "✅ " : "⚠️ ") + (resp.mensaje ?? ""));
    if (resp.ok && tipo === "clientes") await cargar();
  } catch(e){ toast("⚠️ No se pudo leer el fichero"); }
  renderAsistente();
}

    ${c.hecho ? `<div class="caja aviso">Ya tienes una cartera cargada. Si subes otro fichero
      <b>la sustituye</b> (la anterior se guarda en <code>datos/archivo/</code>).</div>` : ""}
    <div class="soltar" data-subir="clientes" onclick="document.getElementById('f-cli').click()">
      <span class="grande">📊</span>Arrastra aquí tu Excel (.xlsx, .xls) o .csv
      <br><span class="nota">o haz clic para buscarlo</span></div>
    <input type="file" id="f-cli" accept=".xlsx,.xls,.csv" class="oculto"
           onchange="subirFichero(this.files[0], 'clientes')">
    ${resultado}`;
}

/* ── Paso 4: IA ── */
function asisIA(){
  const ia = SETUP.ia;
  const fila = (ok, txt, extra) => `<li><span class="ic">${ok ? "✅" : "⬜"}</span>
    <span>${txt}${extra && !ok ? `<div>${extra}</div>` : ""}</span></li>`;
  return `
    <h2>El asistente de IA</h2>
    <p class="intro">El «cerebro» que lee tus correos y redacta los borradores es un programa
      aparte (gratis) que se instala una vez. El panel funciona sin él, pero sin él no se procesan
      correos automáticamente.</p>
    ${ia.listo ? `<div class="caja ok">✅ <b>Todo listo.</b> Puedes cerrar la configuración y pulsar
      «⚡ Procesar ahora» en el panel.</div>` : ""}
    <h3>Opción recomendada: Gemini CLI <span class="nota" style="font-weight:400">(solo tu cuenta de Google, sin tarjeta)</span></h3>
    <ul class="lista-estado">
      ${fila(ia.node, "<b>Node.js</b> instalado",
        `<span class="nota">Descárgalo de <a href="https://nodejs.org" target="_blank" rel="noopener">nodejs.org</a>
         (botón «LTS») e instálalo con las opciones por defecto. Después cierra y vuelve a abrir el panel.</span>`)}
      ${fila(ia.gemini, "<b>Gemini CLI</b> instalado",
        `<span class="nota">Abre «Símbolo del sistema» (tecla Windows → escribe <i>cmd</i>), pega esto y pulsa Intro
         (clic en el recuadro para copiarlo):</span>
         <pre class="cmd" onclick="copiar(this.textContent)">npm install -g @google/gemini-cli</pre>`)}
      ${fila(ia.gemini_configurado, "<b>Gemini</b> conectado a tu Gmail y calendario",
        `<button class="acc primary" style="margin-top:6px" onclick="crearConfigGemini(this)">Configurarlo ahora</button>`)}
    </ul>
    ${ia.gemini && ia.gemini_configurado ? `<div class="caja info">Último paso: la primera vez, abre un
      «Símbolo del sistema» en la carpeta del programa, escribe <code>gemini</code> y pulsa Intro; inicia
      sesión con tu cuenta de Google cuando te lo pida. (Ojo: <b>Asistente.bat</b> abre OpenCode, no Gemini.)</div>` : ""}
    <details class="mas"><summary>Alternativa: OpenCode</summary>
      <ul class="lista-estado">
        ${fila(ia.opencode, "<b>OpenCode</b> instalado",
          `<pre class="cmd" onclick="copiar(this.textContent)">npm install -g opencode-ai</pre>`)}
        ${fila(ia.opencode_configurado, "Configuración del proyecto (<code>opencode.json</code>)")}
      </ul>
      <p class="nota">Con OpenCode, <b>Asistente.bat</b> abre el asistente en modo conversación.</p>
      <p class="nota">Detalles en la guía <code>docs/CONFIGURACION.md</code>, paso 1.</p>
    </details>
    <div style="margin-top:14px"><button class="btn" onclick="recomprobarIA(this)">🔄 Volver a comprobar</button></div>`;
}
async function crearConfigGemini(boton){
  boton.disabled = true;
  const resp = await setupPost("ia/gemini", {});
  toast((resp.ok ? "✅ " : "⚠️ ") + resp.mensaje);
  renderAsistente();
}
async function recomprobarIA(boton){
  boton.disabled = true; await cargarSetup(); renderAsistente(); toast("Comprobado");
}

/* ── Vuelta de Google (?google=ok|error&mensaje=…) ── */
function leerVueltaGoogle(){
  const q = new URLSearchParams(location.search);
  if (!q.has("google")) return null;
  history.replaceState(null, "", "/");
  return {ok: q.get("google") === "ok", mensaje: q.get("mensaje") || ""};
}

/* ── Arranque ── */
async function arrancar(){
  const vuelta = leerVueltaGoogle();
  await cargarSetup();
  await cargar();
  renderAvisoModo();
  if (vuelta){
    ERROR_GOOGLE = vuelta.ok ? null : vuelta.mensaje;
    toast((vuelta.ok ? "✅ " : "⚠️ ") + vuelta.mensaje);
    abrirAsistente(vuelta.ok && !SETUP.datos.hecho ? "datos" : "google");
  } else if (SETUP.primer_uso){
    mostrarBienvenida();
  } else if (SETUP.modo === "real" && !SETUP.completo){
    abrirAsistente();
  }
}

function abrirConfiguracion(){
  if (SETUP && SETUP.modo === "demo") confirmarDatosReales(); else abrirAsistente();
}

arrancar().catch(err => {
  document.getElementById("contenido").innerHTML =
    `<div class="tarjeta"><h3>No se pudo conectar con el servidor local</h3>
     <p class="nota">Cierre esta pestaña y vuelva a abrir el panel con su icono habitual.</p></div>`;
});
</script>
